name: Compilar MilsToz Mic (VST2 x64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar compilador de Visual Studio (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar la DLL
        shell: cmd
        run: call build_msvc.bat

      - name: Subir la DLL como descarga
        uses: actions/upload-artifact@v4
        with:
          name: MilsTozMic-VST2-x64
          path: build/MilsTozMic.dll
